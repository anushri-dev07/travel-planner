name: Build + Release APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore signing keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "no keystore secret, skipping sign setup"; exit 0; fi
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore/travelplanner.keystore
          cat > android/keystore.properties <<EOF
          storeFile=app/keystore/travelplanner.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=travelplanner
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - run: npm install
      - run: npx cap sync android

      - name: Add kotlin exclude
        run: |
          cd android/app
          sed -i 's/android {/android {\n    configurations.all { exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8" }/' build.gradle

      - name: Build debug APK (always installable)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      - name: Collect APK (prefer signed release)
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk TravelPlanner.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk TravelPlanner.apk
          fi
          ls -la TravelPlanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TravelPlanner-APK
          path: TravelPlanner.apk

      - name: Publish permanent Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest TravelPlanner.apk --title "Travel Planner Latest" --notes "Signed APK for all Android 7+ (API 24) phones. No login needed to download."